<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="170" viewBox="0 0 1060 170" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect x="10"  y="50" width="160" height="70" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <rect x="220" y="50" width="160" height="70" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <rect x="430" y="50" width="160" height="70" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <rect x="640" y="50" width="160" height="70" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="850" y="50" width="160" height="70" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>

  <line x1="170" y1="85" x2="212" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="85" x2="422" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="85" x2="632" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="85" x2="842" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="90"  y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">Image</text>
  <text x="90"  y="100" text-anchor="middle" font-size="12" fill="#333">32 x 32 x 3</text>

  <text x="300" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">Tensor</text>
  <text x="300" y="100" text-anchor="middle" font-size="12" fill="#333">[N, 3, 32, 32]</text>

  <text x="510" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#ea4335">Model</text>
  <text x="510" y="100" text-anchor="middle" font-size="12" fill="#333">CNN / ResNet</text>

  <text x="720" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#34a853">Logit</text>
  <text x="720" y="100" text-anchor="middle" font-size="12" fill="#333">sigmoid</text>

  <text x="930" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#f9ab00">P(REAL)</text>
  <text x="930" y="100" text-anchor="middle" font-size="12" fill="#333">0 = FAKE  1 = REAL</text>

  <text x="530" y="150" text-anchor="middle" font-size="13" fill="#666">The forward pass: one image in, one probability out.</text>
</svg>
