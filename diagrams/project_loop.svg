<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="600" fill="#1f2933">CIFAKE training loop — the whole project in one picture</text>

  <rect x="30" y="60" width="170" height="90" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="115" y="98" font-size="14" text-anchor="middle" fill="#1f2933">CIFAKE image</text>
  <text x="115" y="118" font-size="12" text-anchor="middle" fill="#55606b">32×32 RGB</text>

  <rect x="250" y="60" width="190" height="90" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="345" y="98" font-size="14" text-anchor="middle" fill="#1f2933">tensor</text>
  <text x="345" y="118" font-size="12" text-anchor="middle" fill="#55606b">[3, 32, 32], floats −1..1</text>

  <rect x="490" y="60" width="170" height="90" rx="10" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="2"/>
  <text x="575" y="98" font-size="14" text-anchor="middle" fill="#1f2933">model</text>
  <text x="575" y="118" font-size="12" text-anchor="middle" fill="#55606b">MLP or CNN — the weights</text>

  <rect x="710" y="60" width="160" height="90" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="790" y="98" font-size="14" text-anchor="middle" fill="#1f2933">logit</text>
  <text x="790" y="118" font-size="12" text-anchor="middle" fill="#55606b">one raw score</text>

  <rect x="720" y="210" width="160" height="80" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="800" y="245" font-size="14" text-anchor="middle" fill="#1f2933">sigmoid</text>
  <text x="800" y="265" font-size="12" text-anchor="middle" fill="#55606b">P(REAL) in 0..1</text>

  <rect x="420" y="210" width="240" height="80" rx="10" fill="#fff6e5" stroke="#c98a00" stroke-width="2"/>
  <text x="540" y="245" font-size="14" text-anchor="middle" fill="#1f2933">loss (BCE)</text>
  <text x="540" y="265" font-size="12" text-anchor="middle" fill="#55606b">vs. true label 0=FAKE / 1=REAL</text>

  <rect x="140" y="210" width="230" height="80" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="255" y="245" font-size="14" text-anchor="middle" fill="#1f2933">loss.backward()</text>
  <text x="255" y="265" font-size="12" text-anchor="middle" fill="#55606b">gradients for every weight</text>

  <rect x="140" y="340" width="230" height="80" rx="10" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="2"/>
  <text x="255" y="375" font-size="14" text-anchor="middle" fill="#1f2933">optimizer.step()</text>
  <text x="255" y="395" font-size="12" text-anchor="middle" fill="#55606b">weights ← weights − lr·grad</text>

  <line x1="200" y1="105" x2="250" y2="105" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="105" x2="490" y2="105" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="105" x2="710" y2="105" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="150" x2="790" y2="210" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="250" x2="660" y2="250" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="250" x2="370" y2="250" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="255" y1="290" x2="255" y2="340" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>

  <path d="M 140 380 L 20 380 L 20 40 L 575 40 L 575 58" fill="none" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>

  <text x="30" y="478" font-size="12" fill="#55606b">One mini-batch (64 images) → one weight update. 79 updates per epoch with the 5,000-image subset.</text>
  <text x="30" y="502" font-size="12" fill="#55606b">The test set never enters this loop — it only grades the finished model.</text>
</svg>
