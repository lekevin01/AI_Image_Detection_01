<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="15" y="28" font-size="16" font-weight="600" fill="#1f2933">CNN: what happens to one 32×32 image</text>

  <rect x="15" y="70" width="95" height="54" rx="8" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="62" y="93" font-size="11" text-anchor="middle" fill="#1f2933">input</text>
  <text x="62" y="110" font-size="10" text-anchor="middle" fill="#55606b">32×32×3</text>

  <rect x="125" y="70" width="95" height="54" rx="8" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="172" y="93" font-size="11" text-anchor="middle" fill="#1f2933">conv 3×3</text>
  <text x="172" y="110" font-size="10" text-anchor="middle" fill="#55606b">32 maps</text>

  <rect x="235" y="70" width="95" height="54" rx="8" fill="#e9f7ef" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="282" y="93" font-size="11" text-anchor="middle" fill="#1f2933">ReLU</text>
  <text x="282" y="110" font-size="10" text-anchor="middle" fill="#55606b">32×32×32</text>

  <rect x="345" y="70" width="95" height="54" rx="8" fill="#fdecec" stroke="#b34545" stroke-width="1.5"/>
  <text x="392" y="93" font-size="11" text-anchor="middle" fill="#1f2933">pool 2×2</text>
  <text x="392" y="110" font-size="10" text-anchor="middle" fill="#55606b">16×16×32</text>

  <rect x="455" y="70" width="95" height="54" rx="8" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="502" y="93" font-size="11" text-anchor="middle" fill="#1f2933">conv 3×3</text>
  <text x="502" y="110" font-size="10" text-anchor="middle" fill="#55606b">64 maps</text>

  <rect x="565" y="70" width="95" height="54" rx="8" fill="#e9f7ef" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="612" y="93" font-size="11" text-anchor="middle" fill="#1f2933">ReLU</text>
  <text x="612" y="110" font-size="10" text-anchor="middle" fill="#55606b">16×16×64</text>

  <rect x="675" y="70" width="95" height="54" rx="8" fill="#fdecec" stroke="#b34545" stroke-width="1.5"/>
  <text x="722" y="93" font-size="11" text-anchor="middle" fill="#1f2933">pool 2×2</text>
  <text x="722" y="110" font-size="10" text-anchor="middle" fill="#55606b">8×8×64</text>

  <rect x="785" y="70" width="95" height="54" rx="8" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="832" y="93" font-size="11" text-anchor="middle" fill="#1f2933">flatten</text>
  <text x="832" y="110" font-size="10" text-anchor="middle" fill="#55606b">4,096</text>

  <line x1="110" y1="97" x2="125" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="97" x2="235" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="330" y1="97" x2="345" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="97" x2="455" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="550" y1="97" x2="565" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="97" x2="675" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="770" y1="97" x2="785" y2="97" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>

  <line x1="832" y1="124" x2="832" y2="170" stroke="#55606b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="785" y="170" width="180" height="54" rx="8" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="875" y="193" font-size="11" text-anchor="middle" fill="#1f2933">FC 128 → ReLU → 1</text>
  <text x="875" y="210" font-size="10" text-anchor="middle" fill="#55606b">one logit per image</text>

  <text x="15" y="262" font-size="12" fill="#55606b">Each 3×3 filter slides across the image — one filter = one pattern detector. Pooling keeps the strongest value per 2×2 block and halves the map.</text>
</svg>
