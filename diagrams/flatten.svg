<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#1f2933">Flatten: 3 grids → one row per image</text>

  <!-- one image: 3 channel grids -->
  <rect x="60" y="70" width="68" height="68" fill="#fde8e8" stroke="#b34545" stroke-width="2"/>
  <line x1="60" y1="87" x2="128" y2="87" stroke="#b34545" stroke-width="1"/>
  <line x1="60" y1="104" x2="128" y2="104" stroke="#b34545" stroke-width="1"/>
  <line x1="60" y1="121" x2="128" y2="121" stroke="#b34545" stroke-width="1"/>
  <line x1="77" y1="70" x2="77" y2="138" stroke="#b34545" stroke-width="1"/>
  <line x1="94" y1="70" x2="94" y2="138" stroke="#b34545" stroke-width="1"/>
  <line x1="111" y1="70" x2="111" y2="138" stroke="#b34545" stroke-width="1"/>
  <text x="40" y="108" font-size="14" fill="#1f2933">R</text>

  <rect x="60" y="150" width="68" height="68" fill="#e9f7ef" stroke="#2e7d4f" stroke-width="2"/>
  <line x1="60" y1="167" x2="128" y2="167" stroke="#2e7d4f" stroke-width="1"/>
  <line x1="60" y1="184" x2="128" y2="184" stroke="#2e7d4f" stroke-width="1"/>
  <line x1="60" y1="201" x2="128" y2="201" stroke="#2e7d4f" stroke-width="1"/>
  <line x1="77" y1="150" x2="77" y2="218" stroke="#2e7d4f" stroke-width="1"/>
  <line x1="94" y1="150" x2="94" y2="218" stroke="#2e7d4f" stroke-width="1"/>
  <line x1="111" y1="150" x2="111" y2="218" stroke="#2e7d4f" stroke-width="1"/>
  <text x="40" y="188" font-size="14" fill="#1f2933">G</text>

  <rect x="60" y="230" width="68" height="68" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="2"/>
  <line x1="60" y1="247" x2="128" y2="247" stroke="#2f6fdb" stroke-width="1"/>
  <line x1="60" y1="264" x2="128" y2="264" stroke="#2f6fdb" stroke-width="1"/>
  <line x1="60" y1="281" x2="128" y2="281" stroke="#2f6fdb" stroke-width="1"/>
  <line x1="77" y1="230" x2="77" y2="298" stroke="#2f6fdb" stroke-width="1"/>
  <line x1="94" y1="230" x2="94" y2="298" stroke="#2f6fdb" stroke-width="1"/>
  <line x1="111" y1="230" x2="111" y2="298" stroke="#2f6fdb" stroke-width="1"/>
  <text x="40" y="268" font-size="14" fill="#1f2933">B</text>

  <text x="20" y="340" font-size="12" fill="#55606b">one image = 3 grids of 32×32</text>
  <text x="20" y="358" font-size="12" fill="#55606b">(here drawn as 4×4)</text>

  <path d="M 135 200 C 190 150, 250 110, 300 104" fill="none" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>

  <!-- flattened strip -->
  <rect x="320" y="90" width="40" height="30" fill="#fde8e8" stroke="#b34545"/>
  <rect x="360" y="90" width="40" height="30" fill="#fde8e8" stroke="#b34545"/>
  <rect x="400" y="90" width="40" height="30" fill="#fde8e8" stroke="#b34545"/>
  <rect x="440" y="90" width="40" height="30" fill="#fde8e8" stroke="#b34545"/>
  <rect x="480" y="90" width="40" height="30" fill="#e9f7ef" stroke="#2e7d4f"/>
  <rect x="520" y="90" width="40" height="30" fill="#e9f7ef" stroke="#2e7d4f"/>
  <rect x="560" y="90" width="40" height="30" fill="#e9f7ef" stroke="#2e7d4f"/>
  <rect x="600" y="90" width="40" height="30" fill="#e9f7ef" stroke="#2e7d4f"/>
  <rect x="640" y="90" width="40" height="30" fill="#e8f0fe" stroke="#2f6fdb"/>
  <rect x="680" y="90" width="40" height="30" fill="#e8f0fe" stroke="#2f6fdb"/>
  <rect x="720" y="90" width="40" height="30" fill="#e8f0fe" stroke="#2f6fdb"/>
  <rect x="760" y="90" width="40" height="30" fill="#e8f0fe" stroke="#2f6fdb"/>
  <text x="340" y="110" font-size="12" text-anchor="middle" fill="#1f2933">1</text>
  <text x="380" y="110" font-size="12" text-anchor="middle" fill="#1f2933">2</text>
  <text x="420" y="110" font-size="12" text-anchor="middle" fill="#1f2933">3</text>
  <text x="460" y="110" font-size="12" text-anchor="middle" fill="#1f2933">4</text>
  <text x="500" y="110" font-size="12" text-anchor="middle" fill="#1f2933">5</text>
  <text x="540" y="110" font-size="12" text-anchor="middle" fill="#1f2933">6</text>
  <text x="580" y="110" font-size="12" text-anchor="middle" fill="#1f2933">7</text>
  <text x="620" y="110" font-size="12" text-anchor="middle" fill="#1f2933">8</text>
  <text x="660" y="110" font-size="12" text-anchor="middle" fill="#1f2933">9</text>
  <text x="700" y="110" font-size="12" text-anchor="middle" fill="#1f2933">10</text>
  <text x="740" y="110" font-size="12" text-anchor="middle" fill="#1f2933">11</text>
  <text x="780" y="110" font-size="12" text-anchor="middle" fill="#1f2933">12</text>
  <text x="400" y="80" font-size="11" text-anchor="middle" fill="#b34545">R: 1–1,024</text>
  <text x="560" y="80" font-size="11" text-anchor="middle" fill="#2e7d4f">G: 1,025–2,048</text>
  <text x="720" y="80" font-size="11" text-anchor="middle" fill="#2f6fdb">B: 2,049–3,072</text>
  <text x="320" y="140" font-size="12" fill="#55606b">[3, 32, 32] → [3,072] — same numbers, same order, one row</text>

  <line x1="560" y1="140" x2="560" y2="180" stroke="#55606b" stroke-width="2" marker-end="url(#a)"/>

  <!-- batch rows -->
  <rect x="320" y="190" width="480" height="26" rx="5" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="330" y="208" font-size="11" fill="#1f2933">image 1 — 3,072 numbers</text>
  <rect x="320" y="226" width="480" height="26" rx="5" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="330" y="244" font-size="11" fill="#1f2933">image 2 — 3,072 numbers</text>
  <rect x="320" y="262" width="480" height="26" rx="5" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="330" y="280" font-size="11" fill="#1f2933">…</text>
  <rect x="320" y="298" width="480" height="26" rx="5" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="330" y="316" font-size="11" fill="#1f2933">image 64 — 3,072 numbers</text>
  <text x="810" y="208" font-size="12" fill="#55606b">batch of 64:</text>
  <text x="810" y="228" font-size="12" fill="#55606b">[64, 3, 32, 32]</text>
  <text x="810" y="248" font-size="12" fill="#55606b">→ [64, 3,072]</text>

  <!-- why Linear needs a row -->
  <text x="20" y="380" font-size="14" font-weight="600" fill="#1f2933">Why a Linear layer needs this</text>
  <rect x="40" y="400" width="120" height="50" rx="6" fill="#f2f5fa" stroke="#3a4a5f" stroke-width="1.5"/>
  <text x="100" y="431" font-size="13" text-anchor="middle" fill="#1f2933">[64, 3072]</text>
  <text x="180" y="431" font-size="14" text-anchor="middle" fill="#1f2933">×</text>
  <rect x="210" y="400" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="275" y="431" font-size="13" text-anchor="middle" fill="#1f2933">[3072, 128]</text>
  <text x="360" y="431" font-size="14" text-anchor="middle" fill="#1f2933">=</text>
  <rect x="390" y="400" width="110" height="50" rx="6" fill="#fff6e5" stroke="#c98a00" stroke-width="1.5"/>
  <text x="445" y="431" font-size="13" text-anchor="middle" fill="#1f2933">[64, 128]</text>
  <text x="40" y="480" font-size="12" fill="#55606b">Linear(3072, 128): each image's 3,072 numbers → 128 numbers.</text>

  <!-- caution box -->
  <rect x="540" y="380" width="420" height="110" rx="8" fill="#fff6e5" stroke="#c98a00" stroke-width="1.5"/>
  <text x="555" y="402" font-size="13" font-weight="600" fill="#1f2933">Careful: flatten loses position</text>
  <text x="555" y="424" font-size="11" fill="#55606b">Pixel (row 3, col 7) → flat index 154.</text>
  <text x="555" y="444" font-size="11" fill="#55606b">Pixel (row 10, col 2) → flat index 706.</text>
  <text x="555" y="464" font-size="11" fill="#55606b">Both are just numbers now — the grid is gone.</text>
  <text x="555" y="484" font-size="11" fill="#55606b">That is why CNNs keep the 2D grid.</text>
</svg>
